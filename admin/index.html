<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>房產後台內容管理系統</title>
  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    /* 右下角懸浮控制面板（永遠保持在最上層，滑動頁面不消失） */
    .floating-cms-toolbar {
      position: fixed !important;
      bottom: 20px !important;
      right: 15px !important;
      z-index: 999999 !important; /* 超高層級，防止被後台網頁元素遮擋 */
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
      background-color: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 8px 12px;
      border-radius: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(0, 0, 0, 0.1);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 快速切換下拉選單樣式 */
    .mobile-collections-select {
      background-color: #f3f4f6;
      color: #111827;
      border: 1px solid #d1d5db;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* 前台跳轉按鈕樣式 */
    .view-site-btn {
      background-color: #1d4ed8;
      color: #ffffff !important;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      text-decoration: none !important;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      box-shadow: 0 2px 5px rgba(29, 78, 216, 0.3);
      transition: background-color 0.2s ease;
    }

    .view-site-btn:hover {
      background-color: #1e40af;
    }

    /* 手機螢幕優化：適度精簡按鈕邊距與文字 */
    @media (max-width: 480px) {
      .view-site-btn span {
        display: none; /* 隱藏「前台」文字，僅保留圖示以節省空間 */
      }
      .view-site-btn {
        padding: 6px 9px;
      }
    }
  </style>
</head>
<body>

  <!-- 右下角懸浮浮控按鈕區塊 -->
  <div class="floating-cms-toolbar">
    <!-- 文章與物件快速切換選單 -->
    <select class="mobile-collections-select" onchange="if(this.value) { window.location.hash = this.value; this.value = ''; }">
      <option value="">⚡ 快速跳轉...</option>
      <option value="#/collections/posts">📝 文章列表</option>
      <option value="#/collections/properties">🏠 物件列表</option>
    </select>

    <!-- 開啟前台網站按鈕 (使用 ../ 自動對應正確前台網址) -->
    <a href="../" target="_blank" class="view-site-btn" title="瀏覽前台網站">
      <span>前台</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
    </a>
  </div>

  <!-- 引入 Decap CMS 核心腳本 -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
