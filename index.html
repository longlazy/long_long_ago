<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專屬房產顧問網站</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <!-- 解析 Markdown 內容所需的輕量外掛 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 flex flex-col min-h-screen">

    <!-- 導覽列 -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="text-xl font-bold text-blue-600">🏠 專屬房產顧問</div>
            <div class="space-x-4 text-sm font-medium">
                <a href="#properties" class="hover:text-blue-600">精選物件</a>
                <a href="#articles" class="hover:text-blue-600">新聞與知識</a>
                <a href="#tax-calculator" class="hover:text-blue-600">稅費試算</a>
                <a href="/admin/" class="text-xs bg-gray-100 border px-2 py-1 rounded hover:bg-gray-200">管理後台</a>
            </div>
        </div>
    </nav>

    <!-- 主頁形象區 -->
    <section class="bg-blue-900 text-white py-12 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h1 class="text-3xl font-bold mb-2">在地深耕 · 值得信賴的房產專家</h1>
            <p class="text-blue-200 mb-6">提供透明資訊、專業稅費諮詢與優質物件代尋服務</p>
            <a href="https://line.me" target="_blank" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-full shadow-lg inline-block transition">
                💬 加 LINE 諮詢 / 預約看屋
            </a>
        </div>
    </section>

    <!-- 核心內容區 -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow space-y-12">
        
        <!-- 1. 精選物件廣告區 -->
        <section id="properties">
            <h2 class="text-2xl font-bold mb-6 border-l-4 border-blue-600 pl-3">精選物件展示</h2>
            <div id="property-list" class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 動態載入物件卡片 -->
                <p class="text-gray-400 col-span-3">物件載入中...</p>
            </div>
        </section>

        <!-- 2. 新聞資訊 / 不動產知識 / 社區開箱 -->
        <section id="articles">
            <h2 class="text-2xl font-bold mb-6 border-l-4 border-blue-600 pl-3">房產知識與新聞資訊</h2>
            <div id="article-list" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 動態載入文章 -->
                <p class="text-gray-400 col-span-2">文章載入中...</p>
            </div>
        </section>

        <!-- 3. 房地合一稅試算區 -->
        <section id="tax-calculator" class="bg-white p-6 rounded-lg shadow border">
            <h2 class="text-2xl font-bold mb-4 border-l-4 border-blue-600 pl-3">房地合一稅 2.0 簡易試算</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium mb-1">預計出售價格 (萬元)</label>
                    <input type="number" id="sellPrice" placeholder="例如：2000" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">原始買入價格 (萬元)</label>
                    <input type="number" id="buyPrice" placeholder="例如：1500" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">取得與處分必要費用 (萬元)</label>
                    <input type="number" id="costs" placeholder="如仲介費、裝修費 (無輸入預設 3%)" class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">持有時間</label>
                    <select id="years" class="w-full p-2 border rounded">
                        <option value="0.45">2 年內 (稅率 45%)</option>
                        <option value="0.35">超過 2 年，未滿 5 年 (稅率 35%)</option>
                        <option value="0.20">超過 5 年，未滿 10 年 (稅率 20%)</option>
                        <option value="0.15">超過 10 年 (稅率 15%)</option>
                    </select>
                </div>
            </div>
            
            <button onclick="calculateTax()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded transition">
                開始試算
            </button>

            <div id="taxResult" class="mt-4 p-4 bg-gray-50 rounded hidden border border-gray-200">
                <p class="text-lg font-bold text-gray-700">預估房地合一稅：<span id="taxAmount" class="text-red-600 text-xl">0</span> 萬元</p>
                <p class="text-xs text-gray-400 mt-1">* 試算結果僅供參考，實際應納稅額以稅捐稽徵機關核算為準。</p>
            </div>
        </section>

    </main>

    <footer class="bg-gray-800 text-gray-400 py-6 text-center text-sm">
        <p>© 專屬不動產經紀網站. All rights reserved.</p>
    </footer>

    <a href="https://line.me" target="_blank" class="fixed bottom-6 right-6 bg-green-500 text-white p-4 rounded-full shadow-2xl hover:bg-green-600 transition flex items-center space-x-2">
        <span>💬 聯絡我</span>
    </a>

    <script>
        // 1. 稅費試算邏輯
        function calculateTax() {
            const sell = parseFloat(document.getElementById('sellPrice').value) || 0;
            const buy = parseFloat(document.getElementById('buyPrice').value) || 0;
            let costs = parseFloat(document.getElementById('costs').value);
            const taxRate = parseFloat(document.getElementById('years').value);

            if (sell <= 0 || buy <= 0) {
                alert('請輸入正確的出售與買入價格！');
                return;
            }
            if (isNaN(costs)) costs = sell * 0.03;

            const profit = sell - buy - costs;
            const tax = profit > 0 ? profit * taxRate : 0;

            document.getElementById('taxAmount').innerText = tax.toFixed(2);
            document.getElementById('taxResult').classList.remove('hidden');
        }

        // 2. 從 GitHub 自動讀取後台新增的物件與文章內容
        const repoOwner = 'longlazy';
        const repoName = 'long_long_ago';

        async function fetchContent(folderPath, containerId, renderCard) {
            const container = document.getElementById(containerId);
            try {
                const res = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/${folderPath}`);
                if (!res.ok) {
                    container.innerHTML = '<p class="text-gray-400 col-span-2">目前尚無新增內容。</p>';
                    return;
                }
                const files = await res.json();
                container.innerHTML = ''; // 清空載入中字樣

                for (let file of files) {
                    if (file.name.endsWith('.md')) {
                        const fileRes = await fetch(file.download_url);
                        const text = await fileRes.text();
                        
                        // 解析 Markdown 的 Frontmatter YAML 標頭
                        const match = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
                        if (match) {
                            const yamlText = match[1];
                            const body = match[2];
                            
                            // 簡單解析 Key-Value
                            const metadata = {};
                            yamlText.split('\n').forEach(line => {
                                const [key, ...value] = line.split(':');
                                if (key && value) {
                                    metadata[key.trim()] = value.join(':').trim().replace(/^"|"$/g, '');
                                }
                            });

                            container.innerHTML += renderCard(metadata, body);
                        }
                    }
                }
            } catch (err) {
                console.error(err);
                container.innerHTML = '<p class="text-gray-400 col-span-2">內容載入失敗。</p>';
            }
        }

        // 渲染物件卡片 HTML
        function renderPropertyCard(meta) {
            return `
                <div class="bg-white rounded-lg shadow border overflow-hidden">
                    <img src="${meta.image || 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=500'}" class="w-full h-48 object-cover">
                    <div class="p-4">
                        <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-bold">${meta.category || '精選物件'}</span>
                        <h3 class="text-lg font-bold mt-2">${meta.title || '無標題'}</h3>
                        <p class="text-gray-500 text-sm">${meta.specs || ''}</p>
                        <div class="text-red-600 text-xl font-bold mt-3">${meta.price ? meta.price + ' 萬' : ''}</div>
                    </div>
                </div>
            `;
        }

        // 渲染文章卡片 HTML
        function renderArticleCard(meta, body) {
            return `
                <div class="bg-white p-5 rounded-lg shadow border">
                    <span class="text-xs bg-green-100 text-green-800 font-bold px-2 py-1 rounded">${meta.type || '文章'}</span>
                    <h3 class="text-lg font-bold mt-2">${meta.title || '無標題'}</h3>
                    <div class="text-gray-600 text-sm mt-2 line-clamp-3">${marked.parse(body)}</div>
                </div>
            `;
        }

        // 頁面載入後自動執行抓取
        window.onload = () => {
            fetchContent('content/properties', 'property-list', renderPropertyCard);
            fetchContent('content/posts', 'article-list', renderArticleCard);
        };

        // Identity 登入導向
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
